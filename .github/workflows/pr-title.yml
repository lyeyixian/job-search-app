name: Pull request title

# A squash merge puts the pull request title on main, so the title must be a Conventional Commit.
# This is a separate workflow because it also runs when the title changes.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the title is not a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore)(\((web|api)\))?!?: [^ ].*[^. ]$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern" && [ "${#TITLE}" -le 72 ]; then
            echo "The title is a Conventional Commit."
            exit 0
          fi
          echo "::error::The title must be 'type(scope): subject', 72 characters or fewer, with no period at the end. See AGENTS.md."
          exit 1
